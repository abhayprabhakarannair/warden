name: Code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read the change with `gh pr diff ${{ github.event.pull_request.number }}` and open whatever files you
            need for context. Report only real problems: bugs, security issues, broken idempotency, configuration
            that will fail on the target host, missing or wrong tests. Skip style nits and praise.
            Post each finding as an inline comment on the exact line, stating the concrete failure and the fix.
            If there are no findings, post nothing.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
