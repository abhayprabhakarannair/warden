[project]
name = "warden"
version = "0.3.3"
description = "Host agent: power, state and health over MQTT"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=1.6"]

[project.scripts]
warden = "warden.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["B", "I", "UP", "SIM", "RUF"]
